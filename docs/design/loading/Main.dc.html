<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Màn hình tải</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Ma+Shan+Zheng&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.bg{background-image:url(/_blob/c7919fe027298c1d9cb3baf9cf05e1b5);background-size:cover;background-position:center 40%}
.walker{position:absolute;left:0;top:0;width:340px;height:170px;background-image:url(/_blob/3f75158f6361f49a6b133e44fc2c8e74);background-repeat:no-repeat;image-rendering:pixelated;transform-origin:170px 167px;will-change:transform}
.pulse{position:relative;width:10px;height:10px;border-radius:50%;background:#c4a062}
.pulse::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #c4a062;animation:ring 1.1s ease-out infinite}
@keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.fadein{animation:fadein .35s ease-out both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.tip{animation:fadein .4s ease-out both}
.enter{height:48px;padding:0 28px;border:1px solid #c4a062;background:#a8321f;color:#f3e6cc;font:600 16px 'Be Vietnam Pro',sans-serif;cursor:pointer;white-space:nowrap}
.enter:hover{background:#bb3d27}
.enter:focus-visible,.ghost:focus-visible{outline:2px solid #e9cf94;outline-offset:3px}
.ghost{height:44px;padding:0 22px;border:1px solid #6a4f2e;background:#241a13;color:#eadfc6;font:600 14px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.ghost:hover{border-color:#c4a062}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #15110d; font-family: 'Be Vietnam Pro', sans-serif; color: #eadfc6">
  <div class="bg" style="position: absolute; inset: 0"></div>
  <div style="position: absolute; inset: 0; background: rgba(21, 17, 13, 0.58)"></div>

  <div style="position: absolute; left: 64px; top: 40px; display: flex; align-items: center; gap: 12px">
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #a8321f; color: #f3e6cc; font: 22px 'Ma Shan Zheng', serif">漢</div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.16em; color: #e0c48a">MỘT NGÀY Ở TAM QUỐC</div>
  </div>
  <div style="position: absolute; right: 64px; top: 48px; font-size: 14px; color: #cdbf9f">Ván: Lữ Khách · Lượt 2</div>

  <div style="position: absolute; left: 64px; top: 168px; width: 720px">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.18em; color: #e0c48a">ĐANG VÀO</div>
    <div style="display: flex; align-items: baseline; gap: 20px; margin-top: 10px">
      <div style="font: 700 76px/1.05 'Noto Serif', serif; color: #f3e6cc">Lạc Dương</div>
      <div style="font: 46px 'Ma Shan Zheng', serif; color: #c4a062">洛陽</div>
    </div>
    <div style="font-size: 17px; color: #d6c8a8; margin-top: 14px">Trung Nguyên · 22/06/184 · Mùa Hạ</div>
  </div>

  <div style="position: absolute; left: 864px; top: 152px; width: 352px; box-sizing: border-box; padding: 20px 24px; background: rgba(29, 22, 17, 0.9); border: 1px solid #3a2c20">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: #e0c48a">CHUẨN BỊ</div>
    <div style="display: flex; flex-direction: column; gap: 13px; margin-top: 16px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 14px; height: 22px">
          <div style="width: 18px; height: 18px; flex: none; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" stroke="#c4a062" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </sc-if>
            <sc-if value="{{s.active}}" hint-placeholder-val="{{ false }}">
              <div class="pulse"></div>
            </sc-if>
            <sc-if value="{{s.pending}}" hint-placeholder-val="{{ true }}">
              <div style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #7a6a52"></div>
            </sc-if>
          </div>
          <div style="font-size: 15px; font-weight: {{s.weight}}; color: {{s.color}}; white-space: nowrap">{{s.label}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 232px; background: rgba(21, 17, 13, 0.92); border-top: 1px solid #3a2c20"></div>

  <div style="position: absolute; left: 64px; top: 514px; width: 760px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: #e0c48a">MẸO</div>
    <div class="tip" style="font-size: 17px; line-height: 1.5; color: #eadfc6; margin-top: 8px">{{tip}}</div>
  </div>

  <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
    <div class="fadein" style="position: absolute; right: 64px; top: 512px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
      <button class="enter" onClick="{{enter}}">Vào thành</button>
      <div style="font-size: 13px; color: #b9aa8c">hoặc nhấn Enter</div>
    </div>
  </sc-if>

  <div style="position: absolute; left: 64px; top: 639px; width: 1152px; border-top: 2px dashed #5a4632"></div>
  <div style="position: absolute; left: 64px; top: 638px; height: 4px; background: #c4a062; width: {{fillW}}px"></div>
  <sc-for list="{{ticks}}" as="k" hint-placeholder-count="5">
    <div style="position: absolute; top: 632px; width: 2px; height: 16px; background: {{k.color}}; left: {{k.left}}px"></div>
  </sc-for>
  <div class="walker" style="transform: {{walkerT}}; background-position: {{walkerP}}"></div>

  <div style="position: absolute; left: 64px; top: 660px; width: 1152px; display: flex; justify-content: space-between; align-items: center">
    <div aria-live="polite" style="font-size: 15px; color: #d6c8a8">{{status}}</div>
    <div style="font-size: 15px; font-weight: 600; color: #e0c48a; font-variant-numeric: tabular-nums">{{pct}}</div>
  </div>

  <sc-if value="{{entered}}" hint-placeholder-val="{{ false }}">
    <div class="fadein" style="position: absolute; inset: 0; background: #0d0a08; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
      <div style="font: 700 40px 'Noto Serif', serif; color: #f3e6cc">Lạc Dương</div>
      <div style="font-size: 16px; color: #b9aa8c">Cảnh Trong thành hiện ra ở đây, đã tải xong, không còn khựng.</div>
      <button class="ghost" onClick="{{replay}}">Xem lại màn tải</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"speed":{"editor":"enum","options":["Máy nhanh","Máy chậm"],"default":"Máy nhanh"},"autoEnter":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.labels = ['Mở sổ sách ván chơi', 'Nạp 300 danh sĩ thiên hạ', 'Dựng 20 thành trì và thương lộ', 'Tính giá chợ 24 mặt hàng', 'Khởi động khung cảnh', 'Vẽ cảnh Trong thành'];
    this.tips = [
      'Đi bộ mang theo được 40 đơn vị hàng. Muốn chở nhiều hơn, hãy thuê Thương Đoàn.',
      'Mệt từ 95 trở lên thì không thể lên đường hay giao đấu. Nghỉ ngơi trước đã.',
      'Bộ khắc Cung, Cung khắc Kỵ, Kỵ khắc Bộ. Chọn binh chủng trước khi lên lôi đài.',
      'Lễ vật càng quý, danh sĩ bậc cao càng dễ kết giao.',
      'Hàng để lại ở thành nào vẫn nằm ở thành đó. Mở Bản đồ để xem đồ của mình ở đâu.'
    ];
    this.state = { n: 0, entered: false };
    this.reset();
  }
  reset() { this.sim = { t: 0, pos: 0, dist: 0, it: 0, moving: false, ready: false }; }
  componentDidMount() {
    this.last = performance.now();
    const loop = (t) => { this.frame(t); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); clearTimeout(this.to); }
  durs() {
    const k = (this.props.speed ?? 'Máy nhanh') === 'Máy chậm' ? 3 : 1;
    return [0.12, 0.35, 0.25, 0.2, 0.55, 0.3].map((d) => d * k);
  }
  stepAt(t) {
    const d = this.durs();
    let acc = 0;
    for (let i = 0; i < d.length; i++) {
      if (t < acc + d[i]) return { i, frac: (t - acc) / d[i] };
      acc += d[i];
    }
    return { i: d.length, frac: 0 };
  }
  frame(t) {
    const dt = Math.min(0.05, (t - this.last) / 1000);
    this.last = t;
    const s = this.sim;
    s.it += dt;
    if (this.state.entered) return;
    s.t += dt;
    const st = this.stepAt(s.t);
    const target = Math.min(1, (st.i + st.frac) / this.labels.length);
    const step = Math.min(0.42 * dt, Math.max(0, (target - s.pos) * Math.min(1, dt * 6)));
    s.moving = step > 0.0004;
    s.dist += step * 1152;
    s.pos = Math.min(1, s.pos + step);
    if (st.i >= this.labels.length && s.pos > 0.995 && !s.ready) {
      s.pos = 1;
      s.ready = true;
      if (this.props.autoEnter) this.to = setTimeout(() => this.enter(), 600);
    }
    this.setState({ n: this.state.n + 1 });
  }
  enter() { clearTimeout(this.to); this.setState({ entered: true }); }
  replay() { this.reset(); this.setState({ entered: false }); }
  renderVals() {
    const s = this.sim;
    const st = this.stepAt(s.t);
    const n = this.labels.length;
    const steps = this.labels.map((label, i) => {
      const done = i < st.i, active = i === st.i;
      return { label, done, active, pending: !done && !active, weight: active ? 600 : 400, color: done ? '#b9aa8c' : active ? '#f3e6cc' : '#9a8a6e' };
    });
    const fr = s.ready || !s.moving ? Math.floor(s.it / 0.3) % 4 : 4 + Math.floor(s.dist / 16) % 8;
    const x = 64 + s.pos * 1152 - 170;
    const ticks = [1, 2, 3, 4, 5].map((k) => ({ left: 64 + (k / n) * 1152 - 1, color: s.pos >= k / n ? '#c4a062' : '#5a4632' }));
    return {
      steps, ticks,
      tip: this.tips[Math.floor(s.it / 4.5) % this.tips.length],
      fillW: Math.round(s.pos * 1152),
      walkerT: `translate3d(${x.toFixed(1)}px, 473px, 0) scale(0.62)`,
      walkerP: `-${fr * 340}px 0`,
      status: s.ready ? 'Đã sẵn sàng · 6/6 bước' : `${this.labels[Math.min(st.i, n - 1)]}…`,
      pct: `${Math.round(s.pos * 100)}%`,
      ready: s.ready,
      entered: this.state.entered,
      enter: () => this.enter(),
      replay: () => this.replay()
    };
  }
}
</script>
</body>
</html>
