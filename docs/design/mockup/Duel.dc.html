<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đơn đấu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15110d}
a{color:#c4a062}a:hover{color:#eadfc6}
.tk-one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes tkBreath{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-5px) scaleY(1.012)}}
@keyframes tkHitA{0%{transform:translateX(0);filter:brightness(1)}20%{transform:translateX(-14px);filter:brightness(2) saturate(.3)}45%{transform:translateX(10px)}70%{transform:translateX(-5px)}100%{transform:translateX(0);filter:brightness(1)}}
@keyframes tkHitB{0%{transform:translateX(0);filter:brightness(1)}20%{transform:translateX(-14px);filter:brightness(2) saturate(.3)}45%{transform:translateX(10px)}70%{transform:translateX(-5px)}100%{transform:translateX(0);filter:brightness(1)}}
@keyframes tkPop{0%{transform:translate(-50%,10px) scale(.9);opacity:0}15%{transform:translate(-50%,0) scale(1);opacity:1}80%{opacity:1}100%{opacity:.85}}
@keyframes tkPopB{0%{transform:translate(-50%,10px) scale(.9);opacity:0}15%{transform:translate(-50%,0) scale(1);opacity:1}80%{opacity:1}100%{opacity:.85}}
@keyframes tkPetal{0%{transform:translate(0,-60px) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translate(-220px,960px) rotate(540deg);opacity:0}}
.tk-breath{animation:tkBreath 4.2s ease-in-out infinite;transform-origin:50% 100%}
.tk-hitA{animation:tkHitA .45s ease-out}
.tk-hitB{animation:tkHitB .45s ease-out}
.tk-popA{animation:tkPop .5s ease-out forwards}
.tk-popB{animation:tkPopB .5s ease-out forwards}
.tk-petal{position:absolute;top:0;width:12px;height:9px;border-radius:70% 0 70% 0;background:#f0a9a0;animation:tkPetal linear infinite}
.tk-move:hover:not(:disabled){border-color:#c4a062;transform:translateY(-2px)}
.tk-move{transition:transform .15s,border-color .15s}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #15110d; color: #eadfc6; font-family: 'Be Vietnam Pro', sans-serif; white-space: nowrap">

  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #2b1d2a 0%, #6b3b3a 36%, #c97a4e 58%, #3a2a22 78%, #1c1410 100%)" aria-hidden="true"></div>
  <svg width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; inset: 0" aria-hidden="true">
    <path d="M0 520 L120 440 L230 490 L360 380 L490 470 L600 420 L720 360 L840 440 L980 400 L1100 460 L1240 380 L1440 430 L1440 900 L0 900 Z" fill="#7a4440" opacity=".55"/>
    <path d="M0 600 C160 540 260 570 380 530 C500 490 600 580 720 560 C860 530 940 480 1080 520 C1200 550 1320 510 1440 530 L1440 900 L0 900 Z" fill="#3a2220"/>
    <ellipse cx="720" cy="760" rx="620" ry="90" fill="#2a1a14"/>
    <ellipse cx="720" cy="760" rx="560" ry="70" fill="none" stroke="#c4a062" stroke-opacity=".25" stroke-width="2" stroke-dasharray="6 10"/>
  </svg>
  <div aria-hidden="true">
    <i class="tk-petal" style="left: 900px; animation-duration: 11s"></i>
    <i class="tk-petal" style="left: 1240px; animation-duration: 13s; animation-delay: -5s"></i>
    <i class="tk-petal" style="left: 520px; animation-duration: 10s; animation-delay: -2s"></i>
    <i class="tk-petal" style="left: 300px; animation-duration: 12s; animation-delay: -8s"></i>
  </div>

  <div style="position: absolute; left: 0; top: 0; z-index: 3"><dc-import name="Hud" active="none" hint-size="1440px,60px"></dc-import></div>

  <div style="position: absolute; left: 50%; top: 80px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-family: 'Ma Shan Zheng', serif; font-size: 30px; color: #c4a062">單挑</span>
      <b style="font-family: 'Noto Serif', serif; font-size: 22px; color: #f3e6cc">Đơn đấu · Luyện thương</b>
    </div>
    <span style="font-size: 13px; color: #cdbd9c">Hiệp <b style="color: #f3e6cc">{{round}}</b> / 12 · Luyện tập: Sinh lực ≤ 30 là chịu thua</span>
  </div>

  <sc-for list="{{sides}}" as="s" hint-placeholder-count="2">
    <div style="{{s.panelPos}}">
      <img src="{{s.face}}" alt="" style="width: 64px; height: 64px; border-radius: 4px; border: 2px solid {{s.ring}}; flex-shrink: 0">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <b style="font-family: 'Noto Serif', serif; font-size: 17px; color: #f3e6cc">{{s.name}}</b>
          <span style="font-size: 12px; color: #b9aa8c">{{s.sub}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px"><span style="width: 52px; font-size: 11px; color: #b9aa8c">Sinh lực</span><div style="flex: 1; height: 10px; background: #2a2019; border-radius: 5px; position: relative"><div style="{{s.hpBar}}"></div><div style="position: absolute; left: 30%; top: -3px; width: 1px; height: 16px; background: #e6a08f"></div></div><b style="width: 30px; text-align: right; font-size: 13px">{{s.hp}}</b></div>
        <div style="display: flex; align-items: center; gap: 8px"><span style="width: 52px; font-size: 11px; color: #b9aa8c">Thể lực</span><div style="flex: 1; height: 6px; background: #2a2019; border-radius: 3px"><div style="{{s.stBar}}"></div></div><b style="width: 30px; text-align: right; font-size: 13px">{{s.st}}</b></div>
      </div>
    </div>
  </sc-for>

  <div style="position: absolute; left: 150px; bottom: 120px; width: 440px; height: 620px" aria-hidden="true">
    <div style="position: absolute; left: 90px; right: 90px; bottom: -10px; height: 40px; background: radial-gradient(ellipse, rgba(0,0,0,.7), transparent 70%)"></div>
    <div class="{{hitP}}" style="position: absolute; inset: 0">
      <div class="tk-breath" style="position: absolute; inset: 0"><img src="/assets/characters/liang_yan/full.webp" alt="" style="width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 0 2px rgba(255,214,150,.7)) drop-shadow(0 16px 24px rgba(0,0,0,.5))"></div>
    </div>
  </div>
  <div style="position: absolute; right: 150px; bottom: 120px; width: 460px; height: 660px" aria-hidden="true">
    <div style="position: absolute; left: 90px; right: 90px; bottom: -10px; height: 40px; background: radial-gradient(ellipse, rgba(0,0,0,.7), transparent 70%)"></div>
    <div class="{{hitE}}" style="position: absolute; inset: 0">
      <div class="tk-breath" style="position: absolute; inset: 0; animation-delay: -1.3s"><img src="/assets/characters/zhang_fei/full.webp" alt="" style="width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; transform: scaleX(-1); filter: drop-shadow(0 0 2px rgba(255,214,150,.7)) drop-shadow(0 16px 24px rgba(0,0,0,.5))"></div>
    </div>
  </div>

  <sc-if value="{{hasEx}}" hint-placeholder-val="{{ true }}">
    <div class="{{popCls}}" style="position: absolute; left: 50%; top: 300px; padding: 14px 22px; background: rgba(18,14,11,.88); border: 1px solid #c4a062; border-radius: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-family: 'Noto Serif', serif; font-size: 22px; font-weight: 700; color: #f3e6cc">{{ex.title}}</span>
      <span style="font-size: 14px; color: {{ex.color}}">{{ex.text}}</span>
    </div>
  </sc-if>

  <section aria-label="Chiêu thức" style="position: absolute; left: 40px; right: 40px; bottom: 20px; height: 112px; display: flex; gap: 16px; align-items: stretch">
    <div style="display: flex; gap: 12px">
      <sc-for list="{{moves}}" as="m" hint-placeholder-count="4">
        <button class="tk-move" disabled="{{over}}" onClick="{{m.pick}}" aria-label="{{m.name}}" style="width: 190px; padding: 12px 14px; background: rgba(36,26,19,.94); border: 1px solid #4a3a2a; border-radius: 4px; color: inherit; font-family: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: baseline; gap: 10px"><span style="font-family: 'Ma Shan Zheng', serif; font-size: 30px; color: {{m.color}}; line-height: 1">{{m.han}}</span><b style="font-family: 'Noto Serif', serif; font-size: 18px; color: #f3e6cc">{{m.name}}</b><span style="margin-left: auto; font-size: 11px; color: #b9aa8c">−{{m.cost}} TL</span></span>
          <span class="tk-one" style="font-size: 12px; color: #b9aa8c">{{m.hint}}</span>
        </button>
      </sc-for>
    </div>
    <div style="flex: 1; min-width: 0; padding: 10px 14px; background: rgba(18,14,11,.88); border: 1px solid #3a2c20; border-radius: 4px; display: flex; flex-direction: column; gap: 4px; overflow: hidden">
      <span style="font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #8f7f62">Diễn biến</span>
      <sc-for list="{{log}}" as="l" hint-placeholder-count="4">
        <span class="tk-one" style="font-size: 12px; color: {{l.c}}">{{l.t}}</span>
      </sc-for>
    </div>
  </section>

  <sc-if value="{{over}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 60px 0 0 0; background: rgba(10,8,6,.72); display: flex; align-items: center; justify-content: center; z-index: 4">
      <div style="width: 520px; padding: 28px 32px; background: #1d1611; border: 1px solid #c4a062; border-radius: 4px; display: flex; flex-direction: column; gap: 14px; align-items: center">
        <span style="font-family: 'Ma Shan Zheng', serif; font-size: 44px; color: {{end.color}}; line-height: 1">{{end.han}}</span>
        <b style="font-family: 'Noto Serif', serif; font-size: 24px; color: #f3e6cc">{{end.title}}</b>
        <span class="tk-one" style="font-size: 14px; color: #cdbd9c; max-width: 100%">{{end.line}}</span>
        <div style="display: flex; gap: 10px">
          <sc-for list="{{end.rewards}}" as="r" hint-placeholder-count="3">
            <span style="font-size: 12px; padding: 4px 10px; border-radius: 3px; background: #2f4a3b; color: #cfe5d6">{{r}}</span>
          </sc-for>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 6px">
          <button onClick="{{reset}}" style="height: 46px; padding: 0 20px; background: transparent; border: 1px solid #c4a062; color: #eadfc6; font-family: 'Noto Serif', serif; font-size: 15px; border-radius: 3px; cursor: pointer">Đấu lại</button>
          <a href="MonthPlan.dc.html" style="text-decoration: none; height: 46px; padding: 0 22px; display: flex; align-items: center; background: #a8321f; color: #f8eedb; font-family: 'Noto Serif', serif; font-weight: 600; font-size: 15px; border-radius: 3px">Về việc tháng</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = this.fresh(184); }
fresh(seed) { return { seed, step: 0, round: 1, php: 100, pst: 100, ehp: 100, est: 100, hist: [], log: [], ex: null, over: '', hits: 0, hitWho: '' }; }
rng(n) { let t = (this.state.seed * 9973 + n * 7919) >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
play(pm) {
  const s = this.state; if (s.over) return;
  const R = this.rng(s.step), P = { war: 55, tier: 2, log: 65 }, E = { war: 97, tier: 4, log: 40, int: 42 };
  const BEATS = { cong: 'hiem', hiem: 'thu', thu: 'cong' }, COUNTER = { cong: 'thu', hiem: 'cong', thu: 'hiem', lui: 'cong' };
  const BASE = { cong: 14, hiem: 20, thu: 10 }, COST = { cong: 12, hiem: 18, thu: 6, lui: 0 };
  const N = { cong: 'Công', thu: 'Thủ', hiem: 'Hiểm', lui: 'Lui' };
  let em;
  const h = s.hist;
  if (h.length >= 2 && h[h.length - 1] === h[h.length - 2] && R() < E.int / 150) em = COUNTER[h[h.length - 1]];
  else { const x = R() * 100; em = x < 50 ? 'cong' : x < 80 ? 'hiem' : 'thu'; }
  const dmg = (m, a, d, st) => Math.round(BASE[m] * (1 + (a.war - d.war) / 100) * (1 + 0.04 * a.tier) * (0.85 + 0.3 * R()) * (st < 20 ? 0.6 : 1));
  let php = s.php, ehp = s.ehp, pst = s.pst, est = s.est, title, text, color = '#eadfc6', hitWho = '', hits = s.hits, over = '';
  if (pm === 'lui') {
    pst = Math.min(100, pst + 10);
    if (R() * 100 < 40 + (P.log - E.log) / 2) { over = 'flee'; title = 'Lui thành công'; text = 'Bạn lùi khỏi vòng đấu'; }
    else { const d = em === 'thu' ? 0 : dmg(em, E, P, est); php -= d; hitWho = d ? 'p' : ''; title = 'Lui hụt!'; text = d ? 'Trương Phi ' + N[em] + ' trúng bạn −' + d : 'Trương Phi chỉ thủ thế'; color = '#e6a08f'; }
  } else if (BEATS[pm] === em) { const d = dmg(pm, P, E, pst); ehp -= d; hits++; hitWho = 'e'; title = N[pm] + ' khắc ' + N[em]; text = 'Bạn đánh trúng −' + d; color = '#8fc4a2'; }
  else if (BEATS[em] === pm) { const d = dmg(em, E, P, est); php -= d; hitWho = 'p'; title = N[em] + ' khắc ' + N[pm]; text = 'Trương Phi đánh trúng bạn −' + d; color = '#e6a08f'; }
  else { const a = Math.round(dmg(pm, P, E, pst) / 2), b = Math.round(dmg(em, E, P, est) / 2); ehp -= a; php -= b; hits++; hitWho = 'p'; title = 'Cùng ' + N[pm]; text = 'Đổi đòn: bạn −' + b + ' · Trương Phi −' + a; }
  pst = Math.max(0, pst - COST[pm]); est = Math.max(0, est - COST[em] + (em === 'thu' ? 4 : 0));
  php = Math.max(0, php); ehp = Math.max(0, ehp);
  if (!over) { if (ehp <= 30) over = 'win'; else if (php <= 30) over = 'lose'; else if (s.round >= 12) over = 'draw'; }
  const line = { t: 'Hiệp ' + s.round + ' · Bạn ' + N[pm] + ', Trương Phi ' + N[em] + ' → ' + text, c: color };
  this.setState({ step: s.step + 1, round: over ? s.round : s.round + 1, php, ehp, pst, est, hist: h.concat(pm), log: [line].concat(s.log).slice(0, 4), ex: { title, text, color }, over, hits, hitWho });
}
renderVals() {
  const s = this.state, k = s.step % 2 ? 'A' : 'B';
  const bar = (v, c) => 'position:absolute;left:0;top:0;bottom:0;width:' + v + '%;background:' + c + ';border-radius:5px;transition:width .35s';
  const exp = Math.min(12, 2 + s.hits * 2);
  const END = {
    win: { han: '勝', color: '#8fc4a2', title: 'Trương Phi thu thương', line: '“Hay! Đệ tiến bộ nhanh lắm!” — Trương Phi cười vang.', rewards: ['+' + (exp + 4) + ' EXP thương pháp', 'Trương Phi +2', 'Danh vọng +1'] },
    lose: { han: '敗', color: '#e6a08f', title: 'Bạn chịu thua', line: 'Trương Phi đỡ bạn dậy: “Thua ta là chuyện thường, mai đấu tiếp!”', rewards: ['+' + exp + ' EXP thương pháp', 'Trương Phi +2'] },
    draw: { han: '和', color: '#c4a062', title: 'Hoà sau 12 hiệp', line: 'Trụ được 12 hiệp với Trương Phi đã là hiếm có.', rewards: ['+' + (exp + 2) + ' EXP thương pháp', 'Trương Phi +3'] },
    flee: { han: '退', color: '#b9aa8c', title: 'Rút khỏi vòng đấu', line: 'Trương Phi cười khẩy: “Mới thế đã lui rồi sao?”', rewards: ['+' + Math.max(1, exp - 2) + ' EXP thương pháp'] }
  };
  const M = [['cong','Công','攻','Thắng Hiểm · thua Thủ','#e07a5f'],['thu','Thủ','守','Phản Công · thua Hiểm','#8fb8c8'],['hiem','Hiểm','險','Phá Thủ · thua Công','#c4a062'],['lui','Lui','退','Rút lui · hồi 10 thể lực','#b9aa8c']];
  const COST = { cong: 12, hiem: 18, thu: 6, lui: 0 };
  return {
    round: s.round, over: !!s.over,
    sides: [
      { name: 'Lương Nhan', sub: 'WAR 55 · Thương bậc 2', face: '/assets/characters/liang_yan/face.webp', ring: '#a8321f', hp: s.php, st: s.pst, hpBar: bar(s.php, '#a8321f'), stBar: bar(s.pst, '#c4a062'),
        panelPos: 'position:absolute;left:40px;top:80px;width:400px;padding:12px 14px;background:rgba(18,14,11,.85);border:1px solid #3a2c20;border-radius:4px;display:flex;gap:12px;align-items:center' },
      { name: 'Trương Phi', sub: 'WAR 97 · Xà mâu bậc 4', face: '/assets/characters/zhang_fei/face.webp', ring: '#c4a062', hp: s.ehp, st: s.est, hpBar: bar(s.ehp, '#a8321f'), stBar: bar(s.est, '#c4a062'),
        panelPos: 'position:absolute;right:40px;top:80px;width:400px;padding:12px 14px;background:rgba(18,14,11,.85);border:1px solid #3a2c20;border-radius:4px;display:flex;gap:12px;align-items:center;flex-direction:row-reverse' }
    ],
    hitP: s.hitWho === 'p' ? 'tk-hit' + k : '', hitE: s.hitWho === 'e' ? 'tk-hit' + k : '',
    hasEx: !!s.ex, ex: s.ex || { title: '', text: '', color: '' }, popCls: 'tk-pop' + k,
    moves: M.map(m => ({ name: m[1], han: m[2], hint: m[3], color: m[4], cost: COST[m[0]], pick: () => this.play(m[0]) })),
    log: s.log.length ? s.log : [{ t: 'Chọn một chiêu để bắt đầu. Trương Phi ưa Công.', c: '#b9aa8c' }],
    end: END[s.over] || END.draw,
    reset: () => this.setState(this.fresh(this.state.seed + 1))
  };
}
}
</script>
</body>
</html>
